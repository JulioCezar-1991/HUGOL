<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;color:#fff;flex-direction:column;gap:20px}.loader{width:60px;height:60px;border:5px solid #333;border-top:5px solid #ff0000;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}p{font-size:18px;color:#aaa}.btn{padding:12px 30px;background:#ff0000;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{background:#cc0000}
    </style>
</head>
<body>
    <div>▶️</div>
    <div class="loader"></div>
    <p>Redirecionando...</p>
    <a href="#" class="btn" id="manualLink">Clique aqui</a>
    <script>
        const url = 'https://www.youtube.com/watch?v=fPO76Jlnz6c&fs=1';
        function redirect(){window.location.href=url}
        setTimeout(redirect,1500);
        document.getElementById('manualLink').addEventListener('click', e=>{e.preventDefault();redirect()});
    </script>
</body>
</html>
