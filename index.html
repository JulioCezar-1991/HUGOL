<!DOCTYPE html>
<html>
<head>
    <title>YouTube Music</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#667eea,#764ba2)}
        .container{text-align:center;background:#fff;padding:50px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        h1{color:#333;margin-bottom:30px;font-size:28px}
        .youtube-btn{display:inline-block;background:#ff0000;color:#fff;padding:18px 50px;font-size:20px;font-weight:bold;text-decoration:none;border-radius:50px;transition:.3s;box-shadow:0 8px 25px rgba(255,0,0,.4);cursor:pointer;border:none}
        .youtube-btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(255,0,0,.5);background:#cc0000}
        .youtube-btn:active{transform:translateY(0)}
        .info{margin-top:20px;color:#666;font-size:14px}
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube</h1>
        <button onclick="window.location.href='https://www.youtube.com/watch?v=v9mGFXaL5z4&list=RDv9mGFXaL5z4&start_radio=1'" class="youtube-btn">▶ Abrir no YouTube</button>
        <p class="info">Clique no botão para abrir a playlist no YouTube</p>
    </div>
</body>
</html>
