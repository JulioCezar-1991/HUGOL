<!DOCTYPE html>
<html>
<head>
    <title>YouTube Music</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #667eea;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .youtube-btn {
            display: inline-block;
            background: #ff0000;
            color: white;
            padding: 18px 50px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }
        .youtube-btn:hover {
            background: #cc0000;
        }
        .info {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 YouTube Music</h1>
        <a href="https://www.youtube.com/watch?v=RXhx1ZNAzQo&list=RDRXhx1ZNAzQo&start_radio=1&rv=fPO76Jlnz6c" class="youtube-btn">▶ Abrir no YouTube</a>
        <p class="info">Clique no botão para abrir a playlist no YouTube</p>
    </div>
</body>
</html>
